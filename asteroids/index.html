<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#020304">
  <title>Asteroids | TomLabs Games</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="cabinet">
    <section class="screen" aria-label="Asteroids arcade game">
      <canvas id="game" width="960" height="720" aria-label="Asteroids game canvas"></canvas>
      <div class="phosphor" aria-hidden="true"></div>

      <div class="utility-bar">
        <a href="../" class="utility-button" aria-label="Back to TomLabs Games" title="Back to games">←</a>
        <button id="soundButton" class="utility-button" type="button" aria-label="Mute sound" title="Mute sound">SND</button>
      </div>

      <section id="startScreen" class="overlay">
        <div class="title-lockup">
          <p class="maker">TomLabs vector system</p>
          <h1>ASTEROIDS</h1>
          <div class="ship-mark" aria-hidden="true"></div>
          <button id="startButton" class="start-button" type="button">1 PLAYER</button>
        </div>
      </section>

      <section id="messageScreen" class="overlay overlay--hidden">
        <div class="message-lockup">
          <p id="messageKicker" class="maker">Transmission ended</p>
          <h2 id="messageTitle">GAME OVER</h2>
          <p id="messageScore">00000</p>
          <button id="restartButton" class="start-button" type="button">PLAY AGAIN</button>
        </div>
      </section>

      <div id="pauseScreen" class="pause overlay--hidden">PAUSED</div>
      <p id="gameStatus" class="sr-only" aria-live="polite">Ready to play</p>
    </section>

    <nav class="control-deck" aria-label="Arcade controls">
      <button id="leftButton" type="button" aria-label="Rotate left" title="Rotate left: Left arrow or A"><span>↶</span><small>LEFT</small></button>
      <button id="rightButton" type="button" aria-label="Rotate right" title="Rotate right: Right arrow or D"><span>↷</span><small>RIGHT</small></button>
      <button id="thrustButton" type="button" aria-label="Thrust" title="Thrust: Up arrow or W"><span>↑</span><small>THRUST</small></button>
      <button id="fireButton" class="fire" type="button" aria-label="Fire" title="Fire: Space"><span>●</span><small>FIRE</small></button>
      <button id="hyperButton" type="button" aria-label="Hyperspace" title="Hyperspace: H"><span>✦</span><small>HYPER</small></button>
    </nav>
  </main>

  <script src="script.js"></script>
</body>
</html>
